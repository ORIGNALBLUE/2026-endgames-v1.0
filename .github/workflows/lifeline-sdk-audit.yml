name: Lifeline SDK Tracker

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit official SDK versions
        shell: pwsh
        run: ./Tools/Update-SDKTracker.ps1 -OutputPath ./sdk_tracker.json -Quiet
